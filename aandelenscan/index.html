<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Multi-bagger detector</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0F3;--panel:#fff;--ink:#16212C;--muted:#667380;--line:#E1E6EA;--acc:#1F4E79;--down:#B23A2A}
@media (prefers-color-scheme:dark){:root{--bg:#10171E;--panel:#18222C;--ink:#E6ECF1;--muted:#8D9AA6;--line:#26323D;--acc:#5B93C7;--down:#EE7B67}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--panel);border-radius:16px;padding:28px 24px;width:min(100%,360px);box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}p{margin:0 0 18px;color:var(--muted);font-size:.9rem}
input{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--acc);border-color:transparent}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--down);font-size:.9rem;min-height:1.3em;margin-top:10px}
</style></head><body>
<form id="f" autocomplete="on"><h1>Multi-bagger detector</h1><p>Geef je wachtwoord om de pagina te openen. Alles wordt in je browser ontsleuteld.</p>
<input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Wachtwoord" required autofocus>
<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem;color:var(--muted)"><input id="rem" type="checkbox" checked style="width:auto;margin:0"> Onthoud me op dit toestel (30 dagen)</label>
<button id="b" type="submit">Openen</button><div class="err" id="e"></div><p style="margin:14px 0 0;font-size:.8rem;color:var(--muted)">Vergeet dit toestel: open de pagina met <code>#uit</code> achter het adres.</p></form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function open(k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},k,u8(P.ct));
 const ds=new DecompressionStream("deflate");const w=ds.writable.getWriter();w.write(new Uint8Array(pt));w.close();
 const html=await new Response(ds.readable).text();
 try{const jwk=JSON.stringify(await crypto.subtle.exportKey("jwk",k));sessionStorage.setItem("fin-k",jwk);const r=document.getElementById("rem");if(!r||r.checked)localStorage.setItem("fin-k",JSON.stringify({k:jwk,exp:Date.now()+30*864e5}));else localStorage.removeItem("fin-k")}catch(e){}
 document.open();document.write(html);document.close();}
if(location.hash==="#uit"){try{localStorage.removeItem("fin-k");sessionStorage.removeItem("fin-k")}catch(e){}history.replaceState(null,"",location.pathname)}
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="";b.disabled=true;b.textContent="Ontsleutelen…";
 try{await open(await key(document.getElementById("pw").value))}catch(x){e.textContent="Verkeerd wachtwoord.";b.disabled=false;b.textContent="Openen"}});
(async()=>{try{let j=sessionStorage.getItem("fin-k");if(!j){const l=JSON.parse(localStorage.getItem("fin-k")||"null");if(l&&l.exp>Date.now())j=l.k;else localStorage.removeItem("fin-k")}if(!j)return;const k=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["decrypt"]);await open(k)}catch(x){try{localStorage.removeItem("fin-k");sessionStorage.removeItem("fin-k")}catch(e){}}})();
