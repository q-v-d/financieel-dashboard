<style>
:root{--bg:#EDF0F3;--panel:#fff;--ink:#16212C;--muted:#667380;--line:#E1E6EA;--acc:#1F4E79;--down:#B23A2A}

input{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}

button{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;cursor:pointer}
button:disabled{opacity:.6}.err{color:var(--down);font-size:.9rem;min-height:1.3em;margin-top:10px}

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw){const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(P.salt),iterations:P.it,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);}
async function open(k){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(P.iv)},k,u8(P.ct));
 const ds=new DecompressionStream("deflate");const w=ds.writable.getWriter();w.write(new Uint8Array(pt));w.close();
 const html=await new Response(ds.readable).text();
 try{sessionStorage.setItem("fin-k",JSON.stringify(await crypto.subtle.exportKey("jwk",k)))}catch(e){}
 document.open();document.write(html);document.close();}
const f=document.getElementById("f"),e=document.getElementById("e"),b=document.getElementById("b");
f.addEventListener("submit",async ev=>{ev.preventDefault();e.textContent="";b.disabled=true;b.textContent="Ontsleutelen…";
 try{await open(await key(document.getElementById("pw").value))}catch(x){e.textContent="Verkeerd wachtwoord.";b.disabled=false;b.textContent="Openen"}});
(async()=>{try{const j=sessionStorage.getItem("fin-k");if(!j)return;const k=await crypto.subtle.importKey("jwk",JSON.parse(j),{name:"AES-GCM"},true,["decrypt"]);await open(k)}catch(x){}})();
